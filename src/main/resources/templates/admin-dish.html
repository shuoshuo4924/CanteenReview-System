<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面里的 fetch 提交要带这个 token，服务端 CsrfInterceptor 会校验 -->
    <meta name="_csrf" th:content="${session.csrfToken}">
    <title>菜品管理 · 吃啥饭后台</title>

    <!-- 设计系统：令牌、排版与通用组件 -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <!-- 后台专属：表格、工具栏、折叠编辑 -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="/dishes" class="brand">吃啥饭 · 后台</a>
        <nav class="user-area">
            <a href="/admin/reviews" class="back">评论审核</a>
            <a href="/admin/suggestions" class="back">建议管理</a>
            <a href="/dishes" class="back">返回前台 →</a>
        </nav>
    </div>
</header>

<main class="wrap">

    <div class="page-head">
        <h1>菜品管理</h1>
        <p>新增、编辑、排序与清理菜品数据</p>
    </div>

    <!-- 提示信息 -->
    <div class="notice ok" th:if="${okMsg}" th:text="${okMsg}">操作成功</div>
    <div class="notice err" th:if="${errMsg}" th:text="${errMsg}">操作失败</div>

    <!-- 新增菜品 -->
    <div class="card">
        <h3 class="card-title">新增菜品</h3>
        <form action="/admin/dish/add" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
            <div class="form-grid">
                <div class="field">
                    <label>菜名 *</label>
                    <input type="text" name="name" placeholder="如：红烧肉" required>
                </div>
                <div class="field">
                    <label>食堂</label>
                    <input type="text" name="canteen" placeholder="如：一食堂">
                </div>
                <div class="field">
                    <label>价格</label>
                    <input type="number" name="price" step="0.1" min="0" placeholder="如：12">
                </div>
                <div class="field">
                    <label>健康建议</label>
                    <input type="text" name="healthTip" maxlength="200"
                           placeholder="如：蛋白质充足，搭配青菜更均衡">
                </div>
                <div class="field">
                    <label>图片</label>
                    <label class="file-box">
                        <input type="file" name="imageFile" accept="image/*">
                        <span>选择图片</span>
                    </label>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">保存菜品</button>
            </div>
        </form>
    </div>

    <!-- 菜品列表 -->
    <div class="card">
        <!-- AI 批量生成：分批处理，前端循环调用直到没有剩余 -->
        <div class="card-head">
            <h3 class="card-title">全部菜品（<span th:text="${#lists.size(dishes)}">0</span>）</h3>
            <div class="ai-batch">
                <span id="aiBatchTip" class="ai-batch-tip">只补还没有建议的菜品，每批 3 道</span>
                <button type="button" class="btn btn-outline btn-sm" id="aiBatchBtn">AI 批量生成建议</button>
            </div>
        </div>

        <!-- 筛选 / 排序工具栏：选择即生效 -->
        <div class="filter-bar">
            <div class="filter-item">
                <label>评分筛选</label>
                <form action="/admin/dishes" method="get">
                    <input type="hidden" name="sortBy" th:value="${sortBy}">
                    <select name="level" onchange="this.form.submit()">
                        <option value="" th:selected="${level == null or level == ''}">全部评分</option>
                        <option value="bad" th:selected="${level == 'bad'}">滞销（0 - 3 分）</option>
                        <option value="normal" th:selected="${level == 'normal'}">正常（3 - 4 分）</option>
                        <option value="good" th:selected="${level == 'good'}">畅销（4 - 5 分）</option>
                    </select>
                </form>
            </div>

            <div class="filter-item">
                <label>排序</label>
                <form action="/admin/dishes" method="get">
                    <input type="hidden" name="level" th:value="${level}">
                    <select name="sortBy" onchange="this.form.submit()">
                        <option value="rating_desc" th:selected="${sortBy == null or sortBy == 'rating_desc'}">评分从高到低</option>
                        <option value="rating_asc" th:selected="${sortBy == 'rating_asc'}">评分从低到高</option>
                        <option value="price_asc" th:selected="${sortBy == 'price_asc'}">价格从低到高</option>
                        <option value="price_desc" th:selected="${sortBy == 'price_desc'}">价格从高到低</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>图片</th>
                    <th>菜名</th>
                    <th>食堂</th>
                    <th>价格</th>
                    <th>评分</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dish : ${dishes}">
                    <td>
                        <img class="thumb" th:if="${dish.imageUrl != null and !#strings.isEmpty(dish.imageUrl)}"
                             th:src="${dish.imageUrl}" alt="">
                        <div class="thumb placeholder" th:if="${dish.imageUrl == null or #strings.isEmpty(dish.imageUrl)}"
                             th:text="${#strings.isEmpty(dish.name) ? '菜' : #strings.substring(dish.name, 0, 1)}">菜</div>
                    </td>
                    <td class="font-bold" th:text="${dish.name}">红烧肉</td>
                    <td class="text-muted" th:text="${dish.canteen}">一食堂</td>
                    <td class="price"
                        th:text="${dish.price != null ? '¥' + #numbers.formatDecimal(dish.price, 1, 0) : '--'}">¥12</td>
                    <td class="score"
                        th:text="${dish.avgRating != null ? '★ ' + dish.avgRating : '暂无'}">★ 4.5</td>
                    <td class="col-actions">
                        <!-- 编辑（折叠表单） -->
                        <details>
                            <summary>编辑</summary>
                            <form class="edit-form" action="/admin/dish/update" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
                                <input type="hidden" name="id" th:value="${dish.id}">
                                <div class="form-grid">
                                    <div class="field">
                                        <label>菜名</label>
                                        <input type="text" name="name" th:value="${dish.name}" required>
                                    </div>
                                    <div class="field">
                                        <label>食堂</label>
                                        <input type="text" name="canteen" th:value="${dish.canteen}">
                                    </div>
                                    <div class="field">
                                        <label>价格</label>
                                        <input type="number" name="price" step="0.1" min="0" th:value="${dish.price}">
                                    </div>
                                    <div class="field">
                                        <label>健康建议</label>
                                        <div class="tip-row">
                                            <input type="text" name="healthTip" maxlength="200"
                                                   placeholder="如：蛋白质充足，搭配青菜更均衡"
                                                   th:value="${dish.healthTip}">
                                            <button type="button" class="btn btn-sm btn-ghost"
                                                    th:attr="data-dish-id=${dish.id}"
                                                    onclick="aiHealthTip(this)">AI 生成</button>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label>换图（不选则保留原图）</label>
                                        <label class="file-box">
                                            <input type="file" name="imageFile" accept="image/*">
                                            <span>选择图片</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="actions">
                                    <button type="submit" class="btn btn-sm btn-primary">保存修改</button>
                                </div>
                            </form>
                        </details>

                        <!-- 删除 -->
                        <form class="delete-form" action="/admin/dish/delete" method="post"
                              onsubmit="return confirm('确定删除这道菜及其所有评价吗？此操作不可恢复！');">
                            <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
                            <input type="hidden" name="id" th:value="${dish.id}">
                            <button type="submit" class="btn btn-sm btn-danger">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(dishes)}">
            <span class="icon">🍽️</span>
            还没有菜品，先在上方新增一道吧
        </div>
    </div>

</main>

<script>
    // 服务端渲染在 <meta name="_csrf"> 里的 token，POST 请求必须带上，否则会被 CSRF 拦截
    function csrfToken() {
        var meta = document.querySelector('meta[name="_csrf"]');
        return meta ? meta.getAttribute('content') : '';
    }

    // 单道：生成后只填进输入框，管理员确认/修改后再点保存，AI 不直接改生产数据
    function aiHealthTip(btn) {
        var form = btn.closest('form');
        var input = form.querySelector('input[name="healthTip"]');
        var id = btn.getAttribute('data-dish-id');
        var oldText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '生成中…';
        fetch('/admin/dish/health-tip?id=' + encodeURIComponent(id), {
            method: 'POST',
            headers: { 'X-CSRF-TOKEN': csrfToken() }
        })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.tip) {
                    input.value = data.tip;
                } else {
                    alert(data.error || '生成失败，稍后再试');
                }
            })
            .catch(function () { alert('网络开小差了，稍后再试'); })
            .finally(function () {
                btn.disabled = false;
                btn.textContent = oldText;
            });
    }

    // 批量：每批 3 道，前端循环调用，直到后端回报 remaining = 0
    (function () {
        var btn = document.getElementById('aiBatchBtn');
        var tip = document.getElementById('aiBatchTip');
        if (!btn) return;

        btn.addEventListener('click', function () {
            btn.disabled = true;
            var generated = 0;
            var failed = 0;

            function step() {
                tip.textContent = '正在生成… 已完成 ' + generated + ' 道';
                fetch('/admin/dish/health-tip/batch?size=3', {
                    method: 'POST',
                    headers: { 'X-CSRF-TOKEN': csrfToken() }
                })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.error) {
                            tip.textContent = data.error;
                            btn.disabled = false;
                            return;
                        }
                        generated += data.done || 0;
                        failed += data.failed || 0;
                        var handled = (data.done || 0) + (data.failed || 0);

                        // 还有剩余且本批确实处理了东西，继续下一批；否则停下避免死循环
                        if (data.remaining > 0 && handled > 0) {
                            setTimeout(step, 300);
                            return;
                        }
                        tip.textContent = '完成：生成 ' + generated + ' 道'
                            + (failed ? '，失败 ' + failed + ' 道' : '')
                            + '，剩余 ' + data.remaining + ' 道';
                        btn.disabled = false;
                        if (generated > 0) {
                            setTimeout(function () { location.reload(); }, 800);
                        }
                    })
                    .catch(function () {
                        tip.textContent = '请求失败，稍后再试';
                        btn.disabled = false;
                    });
            }

            step();
        });
    })();
</script>

</body>
</html>
