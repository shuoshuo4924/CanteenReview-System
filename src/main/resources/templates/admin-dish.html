<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品管理 · 吃啥饭后台</title>

    <!-- 设计系统：令牌、排版与通用组件 -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <!-- 后台专属：表格、工具栏、折叠编辑 -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="/dishes" class="brand">吃啥饭 · 后台</a>
        <a href="/dishes" class="back">返回前台 →</a>
    </div>
</header>

<main class="wrap">

    <div class="page-head">
        <h1>菜品管理</h1>
        <p>新增、编辑、排序与清理菜品数据</p>
    </div>

    <!-- 提示信息 -->
    <div class="notice ok" th:if="${okMsg}" th:text="${okMsg}">操作成功</div>
    <div class="notice err" th:if="${errMsg}" th:text="${errMsg}">操作失败</div>

    <!-- 新增菜品 -->
    <div class="card">
        <h3 class="card-title">新增菜品</h3>
        <form action="/admin/dish/add" method="post" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="field">
                    <label>菜名 *</label>
                    <input type="text" name="name" placeholder="如：红烧肉" required>
                </div>
                <div class="field">
                    <label>食堂</label>
                    <input type="text" name="canteen" placeholder="如：一食堂">
                </div>
                <div class="field">
                    <label>价格</label>
                    <input type="number" name="price" step="0.1" min="0" placeholder="如：12">
                </div>
                <div class="field">
                    <label>图片</label>
                    <label class="file-box">
                        <input type="file" name="imageFile" accept="image/*">
                        <span>选择图片</span>
                    </label>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">保存菜品</button>
            </div>
        </form>
    </div>

    <!-- 菜品列表 -->
    <div class="card">
        <h3 class="card-title">全部菜品（<span th:text="${#lists.size(dishes)}">0</span>）</h3>

        <!-- 筛选 / 排序工具栏：选择即生效 -->
        <div class="filter-bar">
            <div class="filter-item">
                <label>评分筛选</label>
                <form action="/admin/dishes" method="get">
                    <input type="hidden" name="sortBy" th:value="${sortBy}">
                    <select name="level" onchange="this.form.submit()">
                        <option value="" th:selected="${level == null or level == ''}">全部评分</option>
                        <option value="bad" th:selected="${level == 'bad'}">滞销（0 - 3 分）</option>
                        <option value="normal" th:selected="${level == 'normal'}">正常（3 - 4 分）</option>
                        <option value="good" th:selected="${level == 'good'}">畅销（4 - 5 分）</option>
                    </select>
                </form>
            </div>

            <div class="filter-item">
                <label>排序</label>
                <form action="/admin/dishes" method="get">
                    <input type="hidden" name="level" th:value="${level}">
                    <select name="sortBy" onchange="this.form.submit()">
                        <option value="rating_desc" th:selected="${sortBy == null or sortBy == 'rating_desc'}">评分从高到低</option>
                        <option value="rating_asc" th:selected="${sortBy == 'rating_asc'}">评分从低到高</option>
                        <option value="price_asc" th:selected="${sortBy == 'price_asc'}">价格从低到高</option>
                        <option value="price_desc" th:selected="${sortBy == 'price_desc'}">价格从高到低</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>图片</th>
                    <th>菜名</th>
                    <th>食堂</th>
                    <th>价格</th>
                    <th>评分</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dish : ${dishes}">
                    <td>
                        <img class="thumb" th:if="${dish.imageUrl != null and !#strings.isEmpty(dish.imageUrl)}"
                             th:src="${dish.imageUrl}" alt="">
                        <div class="thumb placeholder" th:if="${dish.imageUrl == null or #strings.isEmpty(dish.imageUrl)}"
                             th:text="${#strings.isEmpty(dish.name) ? '菜' : #strings.substring(dish.name, 0, 1)}">菜</div>
                    </td>
                    <td class="font-bold" th:text="${dish.name}">红烧肉</td>
                    <td class="text-muted" th:text="${dish.canteen}">一食堂</td>
                    <td class="price"
                        th:text="${dish.price != null ? '¥' + #numbers.formatDecimal(dish.price, 1, 0) : '--'}">¥12</td>
                    <td class="score"
                        th:text="${dish.avgRating != null ? '★ ' + dish.avgRating : '暂无'}">★ 4.5</td>
                    <td class="col-actions">
                        <!-- 编辑（折叠表单） -->
                        <details>
                            <summary>编辑</summary>
                            <form class="edit-form" action="/admin/dish/update" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="id" th:value="${dish.id}">
                                <div class="form-grid">
                                    <div class="field">
                                        <label>菜名</label>
                                        <input type="text" name="name" th:value="${dish.name}" required>
                                    </div>
                                    <div class="field">
                                        <label>食堂</label>
                                        <input type="text" name="canteen" th:value="${dish.canteen}">
                                    </div>
                                    <div class="field">
                                        <label>价格</label>
                                        <input type="number" name="price" step="0.1" min="0" th:value="${dish.price}">
                                    </div>
                                    <div class="field">
                                        <label>换图（不选则保留原图）</label>
                                        <label class="file-box">
                                            <input type="file" name="imageFile" accept="image/*">
                                            <span>选择图片</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="actions">
                                    <button type="submit" class="btn btn-sm btn-primary">保存修改</button>
                                </div>
                            </form>
                        </details>

                        <!-- 删除 -->
                        <form class="delete-form" action="/admin/dish/delete" method="post"
                              onsubmit="return confirm('确定删除这道菜及其所有评价吗？此操作不可恢复！');">
                            <input type="hidden" name="id" th:value="${dish.id}">
                            <button type="submit" class="btn btn-sm btn-danger">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(dishes)}">
            <span class="icon">🍽️</span>
            还没有菜品，先在上方新增一道吧
        </div>
    </div>

</main>

</body>
</html>
