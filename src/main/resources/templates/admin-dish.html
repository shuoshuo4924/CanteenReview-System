<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品管理 · 吃啥饭后台</title>
    <style>
        :root {
            --brand: #FF5F2E;
            --brand-dark: #E8501F;
            --star: #FFB400;
            --bg: #FFF8F4;
            --card: #FFFFFF;
            --text: #1F2937;
            --muted: #6B7280;
            --line: #F2E6DE;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }

        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .topbar-inner {
            max-width: 1120px; margin: 0 auto; padding: 12px 20px;
            display: flex; align-items: center; gap: 14px;
        }
        .brand { font-size: 18px; font-weight: 800; color: var(--brand); }
        .topbar-inner .back { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: auto; }
        .topbar-inner .back:hover { color: var(--brand); }

        .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 60px; }

        h2 { font-size: 20px; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }

        .card {
            background: var(--card); border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(180, 120, 90, 0.08);
            padding: 22px; margin-bottom: 22px;
        }

        .notice { padding: 13px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 18px; }
        .notice.ok { background: #EAF7EC; color: #2E7D32; border-left: 4px solid #2E7D32; }
        .notice.err { background: #FFEDEA; color: #D93B21; border-left: 4px solid #D93B21; }

        /* 表单 */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 700; color: #4B5563; margin-bottom: 8px; }
        input[type="text"], input[type="number"] {
            width: 100%; height: 44px; padding: 0 12px; font-size: 15px; font-family: inherit;
            background: #FFFBF8; border: 1.5px solid var(--line); border-radius: 10px;
            outline: none; transition: border-color .2s;
        }
        input:focus { border-color: var(--brand); background: #fff; }

        .file-box {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            height: 44px; padding: 0 12px; border: 2px dashed #F0DCD2; border-radius: 10px;
            background: #FFFBF8; color: var(--muted); font-size: 14px; cursor: pointer;
        }
        .file-box:hover { border-color: var(--brand); color: var(--brand); }
        .file-box input { display: none; }

        .btn {
            height: 44px; padding: 0 22px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
            background: var(--brand); color: #fff; transition: background .2s;
        }
        .btn:hover { background: var(--brand-dark); }
        .btn-sm { height: 34px; padding: 0 14px; font-size: 13px; border-radius: 8px; }
        .btn-danger { background: #D93B21; }
        .btn-danger:hover { background: #B72F19; }
        .btn-ghost { background: #F6F1EE; color: var(--text); }
        .btn-ghost:hover { background: #ECE3DD; }

        .actions { display: flex; gap: 10px; margin-top: 16px; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
        th { font-size: 13px; color: var(--muted); font-weight: 700; }
        tr:hover td { background: #FFF8F4; }
        .thumb {
            width: 52px; height: 40px; border-radius: 8px; object-fit: cover;
            background: #FFE9DC; display: grid; place-items: center; font-size: 20px;
        }
        .price { color: var(--brand); font-weight: 700; }
        .score { color: var(--star); font-weight: 700; }
        .empty { text-align: center; padding: 40px; color: var(--muted); }

        /* 编辑行内表单（用 details 折叠） */
        details summary { cursor: pointer; color: var(--brand); font-weight: 600; font-size: 13px; }
        .edit-form { margin-top: 12px; padding: 16px; background: #FFFBF8; border-radius: 12px; }

        /* 筛选 / 排序工具栏 */
        .filter-bar {
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;
            padding: 14px 16px; margin-bottom: 16px;
            background: #FFFBF8; border-radius: 12px;
        }
        .filter-item { display: flex; flex-direction: column; gap: 6px; }
        .filter-item label { font-size: 12px; font-weight: 700; color: var(--muted); }
        .filter-item select {
            height: 38px; padding: 0 12px; font-size: 14px; font-family: inherit;
            background: #fff; border: 1.5px solid var(--line); border-radius: 8px;
            outline: none; cursor: pointer; color: var(--text);
        }
        .filter-item select:focus { border-color: var(--brand); }

        @media (max-width: 640px) {
            .wrap { padding: 16px 14px 48px; }
            th:nth-child(3), td:nth-child(3) { display: none; }
            .filter-item { flex: 1 1 auto; }
            .filter-item select { width: 100%; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-inner">
        <a href="/dishes" class="brand">🍚 吃啥饭 · 后台</a>
        <a href="/dishes" class="back">返回前台 →</a>
    </div>
</div>

<div class="wrap">
    <h2>🍽️ 菜品管理</h2>

    <!-- 提示信息 -->
    <div class="notice ok" th:if="${okMsg}" th:text="${okMsg}">操作成功</div>
    <div class="notice err" th:if="${errMsg}" th:text="${errMsg}">操作失败</div>

    <!-- 新增菜品 -->
    <div class="card">
        <h3 style="margin:0 0 16px;font-size:16px;">➕ 新增菜品</h3>
        <form action="/admin/dish/add" method="post" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="field">
                    <label>菜名 *</label>
                    <input type="text" name="name" placeholder="如：红烧肉" required>
                </div>
                <div class="field">
                    <label>食堂</label>
                    <input type="text" name="canteen" placeholder="如：一食堂">
                </div>
                <div class="field">
                    <label>价格</label>
                    <input type="number" name="price" step="0.1" min="0" placeholder="如：12">
                </div>
                <div class="field">
                    <label>图片</label>
                    <label class="file-box">
                        <input type="file" name="imageFile" accept="image/*">
                        <span>📷 选择图片</span>
                    </label>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn">保存菜品</button>
            </div>
        </form>
    </div>

    <!-- 菜品列表 -->
    <div class="card">
        <h3 style="margin:0 0 12px;font-size:16px;">📋 全部菜品（<span th:text="${#lists.size(dishes)}">0</span>）</h3>

        <!-- 筛选 / 排序工具栏：选择即筛选 -->
        <div class="filter-bar">
            <div class="filter-item">
                <label>评分筛选</label>
                <form action="/admin/dishes" method="get">
                    <!-- 保留当前排序条件 -->
                    <input type="hidden" name="sortBy" th:value="${sortBy}">
                    <select name="level" onchange="this.form.submit()">
                        <option value="" th:selected="${level == null or level == ''}">全部评分</option>
                        <option value="bad" th:selected="${level == 'bad'}">⚠️ 滞销 (0 - 3分)</option>
                        <option value="normal" th:selected="${level == 'normal'}">😐 正常 (3 - 4分)</option>
                        <option value="good" th:selected="${level == 'good'}">🔥 畅销 (4 - 5分)</option>
                    </select>
                </form>
            </div>

            <div class="filter-item">
                <label>排序</label>
                <form action="/admin/dishes" method="get">
                    <!-- 保留当前评分筛选条件 -->
                    <input type="hidden" name="level" th:value="${level}">
                    <select name="sortBy" onchange="this.form.submit()">
                        <option value="rating_desc" th:selected="${sortBy == null or sortBy == 'rating_desc'}">评分从高到低</option>
                        <option value="rating_asc" th:selected="${sortBy == 'rating_asc'}">评分从低到高</option>
                        <option value="price_asc" th:selected="${sortBy == 'price_asc'}">价格从低到高</option>
                        <option value="price_desc" th:selected="${sortBy == 'price_desc'}">价格从高到低</option>
                    </select>
                </form>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>图片</th>
                <th>菜名</th>
                <th>食堂</th>
                <th>价格</th>
                <th>评分</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dish : ${dishes}">
                <td>
                    <img class="thumb" th:if="${dish.imageUrl != null and !#strings.isEmpty(dish.imageUrl)}"
                         th:src="${dish.imageUrl}" alt="">
                    <div class="thumb" th:if="${dish.imageUrl == null or #strings.isEmpty(dish.imageUrl)}">🍱</div>
                </td>
                <td th:text="${dish.name}">红烧肉</td>
                <td th:text="${dish.canteen}">一食堂</td>
                <td class="price"
                    th:text="${dish.price != null ? '¥' + #numbers.formatDecimal(dish.price, 1, 0) : '--'}">¥12</td>
                <td class="score"
                    th:text="${dish.avgRating != null ? '★ ' + dish.avgRating : '暂无'}">★ 4.5</td>
                <td>
                    <!-- 编辑（折叠表单） -->
                    <details>
                        <summary>编辑</summary>
                        <form class="edit-form" action="/admin/dish/update" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="id" th:value="${dish.id}">
                            <div class="form-grid">
                                <div class="field">
                                    <label>菜名</label>
                                    <input type="text" name="name" th:value="${dish.name}" required>
                                </div>
                                <div class="field">
                                    <label>食堂</label>
                                    <input type="text" name="canteen" th:value="${dish.canteen}">
                                </div>
                                <div class="field">
                                    <label>价格</label>
                                    <input type="number" name="price" step="0.1" min="0" th:value="${dish.price}">
                                </div>
                                <div class="field">
                                    <label>换图（不选则保留原图）</label>
                                    <label class="file-box">
                                        <input type="file" name="imageFile" accept="image/*">
                                        <span>📷 选择图片</span>
                                    </label>
                                </div>
                            </div>
                            <div class="actions">
                                <button type="submit" class="btn btn-sm">保存修改</button>
                            </div>
                        </form>
                    </details>

                    <!-- 删除 -->
                    <form action="/admin/dish/delete" method="post" style="display:inline;"
                          onsubmit="return confirm('确定删除这道菜及其所有评价吗？此操作不可恢复！');">
                        <input type="hidden" name="id" th:value="${dish.id}">
                        <button type="submit" class="btn btn-sm btn-danger" style="margin-top:8px;">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="empty" th:if="${#lists.isEmpty(dishes)}">还没有菜品，先在上方新增一道吧</div>
    </div>
</div>

</body>
</html>
