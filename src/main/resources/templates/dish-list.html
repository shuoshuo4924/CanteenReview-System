<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吃啥饭 · 校园食堂评价</title>

    <!-- 设计系统：令牌、排版与通用组件 -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <!-- 首页专属：Hero、人气榜、菜品网格 -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<!-- ================= 顶部导航 ================= -->
<header class="topbar">
    <div class="topbar-inner">
        <a href="/dishes" class="brand">吃啥饭</a>

        <nav class="user-area">
            <th:block th:if="${session.loginUser != null}">
                <div class="avatar" th:text="${#strings.substring(session.loginUser.username, 0, 1).toUpperCase()}">A</div>
                <span th:text="${session.loginUser.username}">同学</span>
                <a th:if="${session.loginUser.role == 'ADMIN'}" href="/admin/dishes" class="btn btn-primary">管理</a>
                <a href="/logout" class="btn btn-ghost">退出</a>
            </th:block>

            <th:block th:if="${session.loginUser == null}">
                <a href="/login" class="btn btn-ghost">登录</a>
                <a href="/register" class="btn btn-primary">注册</a>
            </th:block>
        </nav>
    </div>
</header>

<main class="shell">

    <!-- ================= Hero ================= -->
    <section class="hero">
        <span class="hero-kicker">Campus Canteen Review</span>
        <h1>今天，<em>吃点啥</em>？</h1>
        <p>真实同学评价，帮你避开食堂雷区。</p>

        <div class="stats">
            <div class="stat">
                <b th:text="${dishPage != null ? dishPage.total : #lists.size(dishes)}">15</b>
                <span>在售菜品</span>
            </div>
            <div class="stat">
                <b th:text="${#lists.size(topDishes) >= 3 ? 3 : #lists.size(topDishes)}">3</b>
                <span>人气上榜</span>
            </div>
        </div>
    </section>

    <!-- ================= 人气榜 ================= -->
    <section class="section">
        <div class="section-head">
            <h2>人气榜</h2>
            <span class="sub">按平均分排序</span>
        </div>

        <div class="rank-list">
            <!-- 只展示前 3 名 -->
            <a class="rank-item" th:each="topDish, iterStat : ${topDishes}"
               th:if="${iterStat.count <= 3}"
               th:href="@{/dish/detail(id=${topDish.id})}">

                <!-- 菜品图片：有图显示图片，没图用菜名首字做占位 -->
                <div class="rank-thumb">
                    <img th:if="${topDish.imageUrl != null and !#strings.isEmpty(topDish.imageUrl)}"
                         th:src="${topDish.imageUrl}" th:alt="${topDish.name}">
                    <span th:if="${topDish.imageUrl == null or #strings.isEmpty(topDish.imageUrl)}"
                          th:text="${#strings.isEmpty(topDish.name) ? '菜' : #strings.substring(topDish.name, 0, 1)}">菜</span>
                </div>

                <div class="rank-body">
                    <div class="rank-line">
                        <span class="rank-num" th:text="${#numbers.formatInteger(iterStat.count, 2)}">01</span>
                        <span class="rank-score">
                            ★ <span th:text="${topDish.avgRating != null ? topDish.avgRating : '0.0'}">0.0</span>
                        </span>
                    </div>

                    <div class="rank-name" th:text="${topDish.name}">麻辣香锅</div>

                    <div class="rank-meta">
                        <span class="rank-tag" th:text="${topDish.canteen}">三食堂</span>
                        <span class="rank-price"
                              th:text="${topDish.price != null ? '¥' + #numbers.formatDecimal(topDish.price, 1, 0) : '¥ --'}">
                            ¥12
                        </span>
                    </div>
                </div>
            </a>

            <div class="empty empty-wide" th:if="${#lists.isEmpty(topDishes)}">
                <span class="icon">📭</span>
                还没有评分数据，快去当第一个评价的人吧
            </div>
        </div>
    </section>

    <!-- ================= 全部菜品 ================= -->
    <section class="section">
        <div class="section-head">
            <h2>全部菜品</h2>
            <span class="sub" th:text="'共 ' + ${#lists.size(dishes)} + ' 道'">共 15 道</span>
        </div>

        <!-- 搜索框 -->
        <form class="search-bar" action="/dishes" method="get">
            <input type="text" name="keyword" placeholder="搜菜名或食堂，如：红烧肉 / 一食堂"
                   th:value="${keyword}">
            <select name="minRating">
                <option value="">全部评分</option>
                <option value="4.5" th:selected="${minRating != null and minRating == 4.5}">4.5 分以上</option>
                <option value="4" th:selected="${minRating != null and minRating == 4}">4 分以上</option>
                <option value="3" th:selected="${minRating != null and minRating == 3}">3 分以上</option>
            </select>
            <button type="submit" class="search-btn">搜索</button>
            <a th:if="${searching}" href="/dishes" class="search-clear">清除</a>
        </form>

        <!-- 搜索结果提示 -->
        <div class="search-result-tip" th:if="${searching}">
            找到 <b th:text="${#lists.size(dishes)}">0</b> 个结果
            <span th:if="${keyword != null and !keyword.isBlank()}" th:text="'，关键词：' + ${keyword}"></span>
        </div>

        <div class="dish-grid">
            <a class="dish-card" th:each="dish : ${dishes}" th:href="@{/dish/detail(id=${dish.id})}">

                <!-- 有图显示图片，没图用菜名首字占位 -->
                <div class="dish-thumb">
                    <img th:if="${dish.imageUrl != null and !#strings.isEmpty(dish.imageUrl)}"
                         th:src="${dish.imageUrl}" th:alt="${dish.name}">
                    <span th:if="${dish.imageUrl == null or #strings.isEmpty(dish.imageUrl)}"
                          th:text="${#strings.isEmpty(dish.name) ? '菜' : #strings.substring(dish.name, 0, 1)}">菜</span>
                </div>

                <div class="dish-body">
                    <div class="dish-title">
                        <span class="dish-name" th:text="${dish.name}">红烧肉</span>
                        <span class="dish-price"
                              th:text="${dish.price != null ? '¥' + #numbers.formatDecimal(dish.price, 1, 0) : '¥ --'}">
                            ¥12
                        </span>
                    </div>

                    <div class="dish-meta">
                        <span class="dish-tag" th:text="${dish.canteen}">一食堂</span>
                        <span class="dish-rate" th:if="${dish.avgRating != null and dish.avgRating > 0}">
                            ★ <span th:text="${dish.avgRating}">4.5</span>
                        </span>
                        <span class="dish-rate none" th:if="${dish.avgRating == null or dish.avgRating == 0}">暂无评分</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 搜索无结果 -->
        <div class="empty" th:if="${searching and #lists.isEmpty(dishes)}">
            <span class="icon">🔍</span>
            没有找到符合条件的菜品，换个关键词试试吧
        </div>

        <!-- 没有任何菜品 -->
        <div class="empty" th:if="${!searching and #lists.isEmpty(dishes)}">
            <span class="icon">🍽️</span>
            还没有菜品，等管理员上新吧
        </div>

        <!-- 分页栏：仅在有多页时显示 -->
        <div class="pagination" th:if="${dishPage != null and dishPage.pages > 1}"
             th:with="cur=${dishPage.current}, total=${dishPage.pages}">

            <!-- 上一页：文字用 span 包住，手机端只留箭头 -->
            <a th:if="${cur > 1}"
               th:href="@{/dishes(keyword=${keyword}, minRating=${minRating}, page=${cur - 1}, size=${dishPage.size})}">‹<span class="pg-label">上一页</span></a>
            <span th:if="${cur <= 1}" class="disabled">‹<span class="pg-label">上一页</span></span>

            <!-- 页码：首尾 + 当前页附近，用省略号收拢 -->
            <th:block th:each="p : ${#numbers.sequence(1, total)}">
                <a th:if="${p == 1 or p == total or (p >= cur - 2 and p <= cur + 2)}"
                   th:href="@{/dishes(keyword=${keyword}, minRating=${minRating}, page=${p}, size=${dishPage.size})}"
                   th:text="${p}"
                   th:classappend="${p == cur} ? 'active'"></a>
                <span th:if="${p == cur - 3 and p > 1}" class="dots">…</span>
                <span th:if="${p == cur + 3 and p < total}" class="dots">…</span>
            </th:block>

            <!-- 下一页 -->
            <a th:if="${cur < total}"
               th:href="@{/dishes(keyword=${keyword}, minRating=${minRating}, page=${cur + 1}, size=${dishPage.size})}"><span class="pg-label">下一页</span>›</a>
            <span th:if="${cur >= total}" class="disabled"><span class="pg-label">下一页</span>›</span>

            <span class="page-info" th:text="'第 ' + ${cur} + ' / ' + ${total} + ' 页，共 ' + ${dishPage.total} + ' 道菜'"></span>
        </div>
    </section>

</main>

<footer class="footer">吃啥饭 · 校园食堂评价系统</footer>

</body>
</html>
