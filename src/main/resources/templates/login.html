<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 吃啥饭</title>

    <!-- 设计系统：令牌、排版与通用组件 -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <!-- 登录 / 注册专属 -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-head">
        <span class="auth-mark">吃啥饭 · Campus Canteen Review</span>
        <h1>欢迎回来</h1>
        <p>登录后就能给食堂菜品打分了</p>
    </div>

    <div class="ok-msg" th:if="${ok}">
        <span th:text="${ok}">密码已重置，请用新密码登录</span>
    </div>

    <div class="error-msg" th:if="${error}">
        <span th:text="${error}">账号或密码错误</span>
        <a th:if="${notRegistered}" href="/register" class="msg-link">去注册 →</a>
    </div>

    <form action="/login" method="post" class="auth-form">
        <div class="field">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required autocomplete="username"
                   th:value="${param.username}">
        </div>

        <div class="field">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <p class="auth-switch">
        <a href="/forgot">忘记密码</a>
        <span class="sep">·</span>
        没有账号？<a href="/register">立即注册</a>
    </p>
</div>

</body>
</html>
