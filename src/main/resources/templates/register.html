<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${session.csrfToken}">
    <title>注册 · 吃啥饭</title>

    <!-- 设计系统：令牌、排版与通用组件 -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <!-- 登录 / 注册专属 -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-head">
        <span class="auth-mark">吃啥饭 · Campus Canteen Review</span>
        <h1>加入吃啥饭</h1>
        <p>注册一个账号，开始你的美食点评</p>
    </div>

    <div class="error-msg" th:if="${error}">
        <span th:text="${error}">用户名已被注册</span>
    </div>

    <form action="/register" method="post" class="auth-form">
        <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
        <div class="field">
            <label>用户名</label>
            <input type="text" name="username" placeholder="给自己起个名字" required maxlength="20"
                   autocomplete="username" th:value="${param.username}">
        </div>

        <div class="field">
            <label>密码</label>
            <input type="password" name="password" placeholder="设置一个密码（至少 6 位）" required
                   minlength="6" maxlength="64" autocomplete="new-password">
        </div>

        <div class="field">
            <label>密保问题</label>
            <select name="securityQuestion" required>
                <option th:each="q : ${securityQuestions}"
                        th:value="${q}"
                        th:text="${q}"
                        th:selected="${param.securityQuestion != null and param.securityQuestion[0] == q}">
                    你小学时最好的朋友叫什么名字？
                </option>
            </select>
        </div>

        <div class="field">
            <label>密保答案</label>
            <input type="text" name="securityAnswer" placeholder="填写上面问题的答案" required autocomplete="off"
                   th:value="${param.securityAnswer}">
        </div>

        <p class="form-hint">忘记密码时用它验证身份，答案不区分大小写；选一个答案不会变、别人也猜不到的问题。</p>

        <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>

    <p class="auth-switch">
        <a href="/forgot">忘记密码</a>
        <span class="sep">·</span>
        已有账号？<a href="/login">去登录</a>
    </p>
</div>

</body>
</html>
