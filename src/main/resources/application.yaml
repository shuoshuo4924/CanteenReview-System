spring:
  # 开发期关闭模板缓存：改完 html 刷新浏览器就能看到，不用重启应用
  # 部署上线时改回 true 可以省掉每次渲染重新解析模板的开销
  thymeleaf:
    cache: false

  datasource:
    url: jdbc:mysql://localhost:3307/canteen_review?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传大小限制（手机拍照照片通常 2~5MB，默认 1MB 会失败）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# AI 评价总结（DeepSeek）
# api-key 建议放环境变量 DEEPSEEK_API_KEY，避免把密钥提交到 git；
# 本地临时调试也可以直接写在冒号后面，但别提交。
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat

# 图片存储配置（统一在这一处维护，避免代码里到处硬编码路径）
app:
  # 图片真实保存目录，末尾必须带斜杠
  image-dir: D:/canteen-images/
  # 浏览器访问图片时的 URL 前缀，需要和 WebConfig 里的映射一致
  image-url-prefix: /images/
  # 是否信任反向代理传来的 X-Forwarded-For。
  # 直连部署必须保持 false，否则客户端换个伪造的头就能绕过注册/登录/AI 的限流。
  # 只有前面挂了 Nginx 且由它覆盖该头时，才改成 true。
  trust-proxy: false

server:
  servlet:
    session:
      # 只用 Cookie 传 sessionId，禁用 URL 重写，避免 ;jsessionid= 出现在日志和 Referer 里
      tracking-modes: cookie
      timeout: 30m
