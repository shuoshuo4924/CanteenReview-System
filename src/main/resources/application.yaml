spring:
  # 开发期关闭模板缓存：改完 html 刷新浏览器就能看到，不用重启应用
  # 部署上线时改回 true 可以省掉每次渲染重新解析模板的开销
  thymeleaf:
    cache: false

  # 启动 banner / 日志的 ANSI 颜色。默认 detect 在 IDEA 控制台里常判定为不支持，
  # 导致 banner.txt 里的 ${AnsiColor.XXX} 被替换成空串（不报错、也不变色）。
  output:
    ansi:
      enabled: always

  datasource:
    url: jdbc:mysql://localhost:3307/canteen_review?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 数据库版本迁移：启动时把 db/migration 下未执行的脚本按版本号顺序跑一遍。
  # 已有的库第一次启动会被"基线"在 1，表示 V1 的建表已经手工做过了，不会重复建表报错；
  # 全新的空库则正常从 V1 开始建表。
  # 表结构变更一律新增 V2__xxx.sql、V3__xxx.sql，不要改动已执行过的脚本（Flyway 会校验校验和）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  # 文件上传大小限制（手机拍照照片通常 2~5MB，默认 1MB 会失败）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# AI 评价总结（DeepSeek）
# api-key 建议放环境变量 DEEPSEEK_API_KEY，避免把密钥提交到 git；
# 本地临时调试也可以直接写在冒号后面，但别提交。
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat

# 图片存储配置（统一在这一处维护，避免代码里到处硬编码路径）
app:
  # 图片真实保存目录，末尾必须带斜杠
  image-dir: D:/canteen-images/
  # 浏览器访问图片时的 URL 前缀，需要和 WebConfig 里的映射一致
  image-url-prefix: /images/
  # 是否信任反向代理传来的 X-Forwarded-For。
  # 直连部署必须保持 false，否则客户端换个伪造的头就能绕过注册/登录/AI 的限流。
  # 只有前面挂了 Nginx 且由它覆盖该头时，才改成 true。
  trust-proxy: false
  # 评论先审后发：true 时新评价进入待审核，管理员在 /admin/reviews 通过后才在前台展示；
  # 关掉（false）就退回"提交即显示"的老行为，历史评价不受影响。
  review-audit: true
  # 限流状态、评论违规封禁状态存在哪：
  # memory=单机内存（默认，重启清零）；redis=多实例共享、重启不丢。
  # 只要部署了不止一个实例，就必须切 redis：否则每台机器各记各的，
  # 换台机器就绕过限流和封禁。
  rate-limit:
    store: memory
  # 词库热更新：每 60 秒检查一次词库文件有没有被改动，改了就重建字典树
  sensitive-words-reload-ms: 60000
  # 词库文件的外部路径（可选）。留空则读 classpath:sensitive-words.txt；
  # 配了外部路径就可以在 jar 外面改词库，不用重新打包
  sensitive-words-path:
  # 日志目录（logback-spring.xml 读取）。相对路径基于进程工作目录，
  # systemd 里 WorkingDirectory=/opt/canteen-review，所以实际落在 /opt/canteen-review/logs
  log-dir: ./logs

server:
  # 部署在 Nginx / 负载均衡后面时取消下面这行的注释。
  # 打开后 Spring 才会相信 X-Forwarded-Proto，从而知道"外部其实是 https"：
  # HSTS 才会下发、重定向地址也才会生成 https://。
  # 直连部署必须保持注释状态 —— 否则客户端自己带一个伪造的转发头就能骗过服务端。
  # forward-headers-strategy: native

  servlet:
    session:
      # 只用 Cookie 传 sessionId，禁用 URL 重写，避免 ;jsessionid= 出现在日志和 Referer 里
      tracking-modes: cookie
      timeout: 30m
      cookie:
        # 跨站请求不带 cookie：配合 OriginCheckInterceptor 构成双重 CSRF 防护。
        # 不用 Strict 是因为那样从外部链接点进来会变成未登录状态，体验太差
        same-site: lax
        http-only: true
        # 上线必须走 HTTPS，并把环境变量 COOKIE_SECURE 设为 true（cookie 只走加密连接）。
        # 本地是 http，保持 false，否则浏览器不会回传 cookie，登录会"成功但立刻掉线"。
        secure: ${COOKIE_SECURE:false}

# 监控端点：只暴露健康检查，且不返回组件细节
# （数据库/Redis 连接状态、磁盘占用、bean 列表都算内部信息，没必要给外部看）。
# 探针需要 /actuator/health 免登录，所以这里靠"减少暴露面"而不是加权限。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
